name: build-payload
# openjdk feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (flavor × version × platform) — flavors are the
# spec 28 §8 implementation axis (temurin / graalvm), platforms
# aarch64-macos + x86_64-windows-ucrt + x86_64-linux-gnu.
#
# kind: runtime (spec 28/29): each leg ships the PAIR — the wrapper exe
# (tebako-runtime-launcher) + the env image (.tfs) + sidecars + the
# release shard. The publish job uploads the pair, derives the release
# monoliths (manifest.json + SHA256SUMS.txt, trr#140) from the shards,
# renders the registry entry from manifests/registry.yaml, and lands it
# by bot PR. `tebako publish` is NOT used: the CLI refuses kind: runtime
# (runtimes publish through the runtime release flow).
#
# PIN DISCIPLINE (the owner's rule): this workflow carries NO version or
# digest literals. recipe.yml is the SSOT — the `tools:` block pins the
# tfs CLI + the link-unit tarball (release + per-platform sha256), the
# `runtime:` block pins the wrapper's product line; tools/pins.rb reads
# them into $GITHUB_ENV and the fetch steps cross-check the pins against
# the release's own SHA256SUMS where the monolith covers the asset (the
# link-unit tarballs are NOT in it — the recipe pin is their anchor).
#
# The wrapper exe (tebako-runtime-launcher) ships since tebako v2.1.0
# (2026-09-01, tamatebako/tebako#498 — spec 30); the
# runtime.wrapper_tebako pin names that line. The pair first dogfooded
# green locally with the wrapper built from tamatebako/tebako@d61ccc50
# (see the promotion PR body).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.flavor }} / ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # Identity only (which leg, which runner, which archiver, which
        # flavor). All versions/digests flow from recipe.yml via
        # tools/pins.rb. flavor is the spec 28 §8 implementation axis —
        # temurin (default) and graalvm publish side by side onto the
        # same tag (the tag IS the tebako product line; the flavors'
        # stems differ by language version).
        flavor: [temurin, graalvm]
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
            exe_suffix: ""
            tar: tar
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            exe_suffix: .exe
            # bsdtar (ucrt64 libarchive) reads the windows zip; GNU tar cannot.
            tar: /d/a/_temp/msys64/ucrt64/bin/bsdtar.exe
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
            exe_suffix: ""
            tar: tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bsdtar is the only msys2 need: the recipe's windows source is a
      # zip and GNU tar cannot read it (the macOS leg uses system tar).
      # gcc-libs rides along for any ucrt64 toolchain binary that still
      # wants the gcc-runtime DLLs; the pinned tebako binaries themselves
      # are statically linked (the release's ship gate audits PE imports).
      - name: Set up MSys2 (ucrt64 bsdtar + gcc runtime)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-gcc-libs

      # recipe.yml's tools block is the toolchain pin SSOT; pins.rb emits
      # TEBAKO_RELEASE, PKG_NAME/PKG_VERSION, the per-platform
      # TFS_ASSET/TFS_SHA256 + LINK_UNIT_ASSET/LINK_UNIT_SHA256 for THIS
      # leg's asset_platform, the wrapper pin (WRAPPER_RELEASE/
      # WRAPPER_ASSET), the RUNTIME_STEM naming base, and PRELOAD_SHIM on
      # POSIX. (windows: the runner's hosted Ruby serves Git-bash steps.)
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        shell: bash
        run: ruby tools/pins.rb "${{ matrix.platform.asset_platform }}" "${{ matrix.flavor }}" --env >> "$GITHUB_ENV"

      # The imager (tfs mkimage/extract) is the product repo's own
      # published binary — releases are the interface; the feedstock
      # never builds the tebako stack from source. The pin flows from
      # recipe.yml and is cross-checked against the release's SHA256SUMS,
      # like the recipe pins the Temurin archive's.
      - name: Fetch the imager (pinned by recipe.yml, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs${{ matrix.platform.exe_suffix }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: recipe.yml=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke, here where the
          # download just happened, not inside the payload step.
          "$TFS_BIN" > /dev/null

      # The wrapper exe — the runtime pair's process entry point (spec
      # 29). Same releases-are-the-interface rule as the imager; ships
      # since tebako v2.1.0 (the recipe's runtime.wrapper_tebako pin
      # names the line).
      - name: Fetch the wrapper (pinned by recipe.yml)
        shell: bash
        env:
          WRAPPER_BIN: .packager/tebako-runtime-launcher${{ matrix.platform.exe_suffix }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$WRAPPER_RELEASE"
          curl -sL --fail -o "$WRAPPER_BIN" "$base/$WRAPPER_ASSET"
          echo "$WRAPPER_SHA256  $WRAPPER_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$WRAPPER_BIN"
          echo "WRAPPER_BIN=$WRAPPER_BIN" >> "$GITHUB_ENV"

      # The preload shim (POSIX legs only): the link-unit tarball carries
      # libtfs_preload for the layout's preload_shim grant — the jail's
      # host-IO binding survives the exec into the JVM. NOT in the
      # release's SHA256SUMS monolith: the recipe pin is the anchor.
      - name: Fetch the preload shim (link-unit, pinned by recipe.yml)
        if: matrix.platform.exe_suffix == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/link-unit.tar.gz "$base/$LINK_UNIT_ASSET"
          echo "$LINK_UNIT_SHA256  .packager/link-unit.tar.gz" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          tar -xzf .packager/link-unit.tar.gz -C .packager
          [ -f "$PRELOAD_SHIM" ] || { echo "::error::link-unit tarball carries no $PRELOAD_SHIM"; exit 1; }

      - name: Build the runtime pair
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TAR: ${{ matrix.platform.tar }}
          TFS_CLI: .packager/tfs${{ matrix.platform.exe_suffix }}
          FLAVOR: ${{ matrix.flavor }}
        # WRAPPER_BIN (the fetch step) and PRELOAD_SHIM (pins.rb, POSIX
        # only) flow through $GITHUB_ENV — process env, not the static
        # env: context. The windows leg runs a closed PATH: the runner's
        # default PATH carries several stray mingw installs, and keeping
        # them out of DLL/tool resolution removes a whole silent-failure
        # class.
        run: |
          if [ "${{ matrix.platform.triplet }}" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32"
          fi
          tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.flavor }}-${{ matrix.platform.triplet }}
          path: out/${{ matrix.flavor }}-${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The runtime release flow (spec 28 §6): the tag IS the tebako
      # product line (v<line>, the trr convention — the resolver's
      # {base}/v<tebako_version>/<asset> URL shape answers it). Assets:
      # the pair per platform + sidecars + shards, then the derived
      # monoliths. `tebako publish` refuses kind: runtime
      # (tebako-cli/src/publish.rs) — the registry entry is rendered from
      # manifests/registry.yaml instead (the CLI never learns a runtime
      # verb until the product ships one).
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: |
          ruby tools/pins.rb macos-arm64 temurin --env >> "$GITHUB_ENV"
          ruby tools/pins.rb macos-arm64 graalvm --env | grep -E '^(PKG_VERSION|RUNTIME_STEM_BASE)=' | sed 's/^/GRAALVM_/' >> "$GITHUB_ENV"
      - name: Create the release + upload the runtime pairs
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" --repo tebako-packages/openjdk \
            --title "$tag — tebako-runtime openjdk (Temurin JRE $PKG_VERSION + GraalVM CE JDK $GRAALVM_PKG_VERSION)" \
            --notes "tebako java runtime pair (wrapper exe + env image) per platform; manifest.json is the release index, SHA256SUMS.txt the trust anchor." \
            || gh release view "$tag" --repo tebako-packages/openjdk > /dev/null
          for shard in out/*/tebako-runtime-*.manifest.json; do
            dir="$(dirname "$shard")"
            stem="$(basename "$shard" .manifest.json)"
            # "$stem"* = the exe (+ .exe on windows), the .tfs, both
            # .sha256 sidecars, the shard — never the sibling
            # payload-<flavor>-<triplet>.yaml.
            gh release upload --clobber "$tag" --repo tebako-packages/openjdk "$dir/$stem"*
          done
      - name: Derive + upload the monoliths (manifest.json + SHA256SUMS.txt)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ruby -rjson -e 'puts JSON.pretty_generate(ARGV.sort.map { |f| JSON.parse(File.read(f)) })' \
            out/*/tebako-runtime-*.manifest.json > manifest.json
          cat out/*/tebako-runtime-*.sha256 > SHA256SUMS.txt
          gh release upload --clobber "$tag" --repo tebako-packages/openjdk manifest.json SHA256SUMS.txt
      # The registry mirrors resolution fields only (L3): the env image
      # is the named artifact per platform; kind: runtime carries NO
      # entrypoints key (the validator: only apps and toolkits declare
      # entrypoints).
      - name: Render the registry entry
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          sha_for() { cut -d' ' -f1 "out/$1/$2.tfs.sha256"; }
          # Both flavors ride the same tag: the temurin template renders
          # the document, the graalvm template appends its entry (the
          # flavors' stems differ by language version, so no key/asset
          # collision).
          sed -e "s|@@VERSION@@|$PKG_VERSION|g" \
              -e "s|@@STEM@@|$RUNTIME_STEM_BASE|g" \
              -e "s|@@TAG@@|$tag|g" \
              -e "s|@@SHA256_MACOS@@|$(sha_for temurin-aarch64-macos "$RUNTIME_STEM_BASE-macos-arm64")|g" \
              -e "s|@@SHA256_LINUX@@|$(sha_for temurin-x86_64-linux-gnu "$RUNTIME_STEM_BASE-linux-gnu-x86_64")|g" \
              -e "s|@@SHA256_WINDOWS@@|$(sha_for temurin-x86_64-windows-ucrt "$RUNTIME_STEM_BASE-windows-ucrt64")|g" \
              manifests/registry.yaml > tpkg-registry.yaml
          sed -e "s|@@G_VERSION@@|$GRAALVM_PKG_VERSION|g" \
              -e "s|@@G_STEM@@|$GRAALVM_RUNTIME_STEM_BASE|g" \
              -e "s|@@TAG@@|$tag|g" \
              -e "s|@@G_SHA256_MACOS@@|$(sha_for graalvm-aarch64-macos "$GRAALVM_RUNTIME_STEM_BASE-macos-arm64")|g" \
              -e "s|@@G_SHA256_LINUX@@|$(sha_for graalvm-x86_64-linux-gnu "$GRAALVM_RUNTIME_STEM_BASE-linux-gnu-x86_64")|g" \
              -e "s|@@G_SHA256_WINDOWS@@|$(sha_for graalvm-x86_64-windows-ucrt "$GRAALVM_RUNTIME_STEM_BASE-windows-ucrt64")|g" \
              manifests/registry-graalvm.yaml >> tpkg-registry.yaml
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          # (the first attempt's branch rejected the second's push, 21.0.12)
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
